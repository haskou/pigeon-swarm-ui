name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Documentation-only changes skip the Test job. The skipped job keeps its name,
  # so the required check still reports. See .github/actions/classify-changes.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.classify.outputs.heavy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changes
        id: classify
        uses: ./.github/actions/classify-changes

  test:
    name: Test
    needs: changes
    if: always() && needs.changes.outputs.heavy != 'false'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Install Chromium
        run: yarn playwright install --with-deps chromium

      - name: Verify stale ICE recovery in Chromium
        run: yarn test:e2e e2e/stale-ice-candidates.spec.ts --project=desktop-chromium

      - name: Verify bounded recovery and real browser audio
        run: yarn test:e2e e2e/call-recovery.spec.ts --project=desktop-chromium

      - name: Build
        run: yarn build

      - name: Build independent client
        run: VITE_INDEPENDENT_CLIENT=true yarn build
