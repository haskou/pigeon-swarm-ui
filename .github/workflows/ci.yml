name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Documentation-only changes skip the Test job. The skipped job keeps its name,
  # so the required check still reports. See .github/actions/classify-changes.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.classify.outputs.heavy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changes
        id: classify
        uses: ./.github/actions/classify-changes

  test:
    name: Test
    needs: changes
    if: always() && needs.changes.outputs.heavy != 'false'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Install Chromium, Firefox and WebKit
        run: yarn playwright install --with-deps chromium firefox webkit

      - name: Verify stale ICE recovery in Chromium
        run: yarn test:e2e e2e/stale-ice-candidates.spec.ts --project=desktop-chromium

      - name: Verify bounded recovery and real browser audio
        run: yarn test:e2e e2e/call-recovery.spec.ts --project=desktop-chromium

      - name: Verify the edit composer keeps input made before a late frame
        run: yarn test:e2e e2e/composer-edit.spec.ts --project=desktop-chromium

      - name: Verify network-change and backend-restart call recovery
        run: yarn test:e2e e2e/call-network-recovery.spec.ts --project=desktop-chromium

      - name: Verify denied and missing microphones in Chromium, Firefox and WebKit
        run: >-
          yarn test:e2e e2e/call-microphone.spec.ts
          --project=desktop-chromium --project=desktop-firefox
          --project=desktop-webkit

      - name: Verify encrypted private call media in Chromium and Firefox
        run: >-
          yarn test:e2e e2e/call-media-encryption.spec.ts
          --project=desktop-chromium --project=desktop-firefox

      - name: Verify the desktop members background in Chromium
        run: yarn test:e2e e2e/members-panel-background.spec.ts --project=desktop-chromium

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: node_modules/.cache/pigeon-swarm-playwright-results
          retention-days: 7

      - name: Build
        run: yarn build

      - name: Build independent client
        run: VITE_INDEPENDENT_CLIENT=true yarn build

  # Builds the node image from the pinned node and wrapper sources, with this
  # commit as the UI, then runs the specs that need a real node. Pins live in
  # .github/node-sha and .github/wrapper-sha; see e2e/README.md.
  real-node-e2e:
    name: Real node end-to-end
    needs: changes
    if: always() && needs.changes.outputs.heavy != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Read pinned node and wrapper
        id: pins
        run: |
          echo "node=$(cat .github/node-sha)" >> "$GITHUB_OUTPUT"
          echo "wrapper=$(cat .github/wrapper-sha)" >> "$GITHUB_OUTPUT"

      - name: Check out wrapper recipe
        uses: actions/checkout@v4
        with:
          repository: haskou/pigeon-swarm
          ref: ${{ steps.pins.outputs.wrapper }}
          path: pigeon-swarm
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build node image from pinned sources
        uses: docker/build-push-action@v6
        with:
          context: pigeon-swarm
          target: production
          load: true
          tags: pigeon-swarm-node:real-node
          build-args: |
            PIGEON_SWARM_NODE_SHA=${{ steps.pins.outputs.node }}
            PIGEON_SWARM_UI_SHA=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha,scope=real-node
          cache-to: type=gha,mode=max,scope=real-node

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Chromium and Firefox
        run: yarn playwright install --with-deps chromium firefox

      - name: Verify messaging, moderation, calls and devices against the real node
        env:
          PIGEON_NODE_IMAGE: pigeon-swarm-node:real-node
        run: yarn test:e2e:real-node

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: real-node-playwright-results
          path: node_modules/.cache/pigeon-swarm-playwright-results
          retention-days: 7
